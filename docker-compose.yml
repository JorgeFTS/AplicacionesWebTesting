# Levanta MySQL + la API de ChambaPro.
# Uso:  cp .env.example .env   (completa los valores)   y luego   docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chambapro}
      MYSQL_USER: ${MYSQL_USER:-chambapro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: ChambaPro.Platform.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-chambapro};User=${MYSQL_USER:-chambapro};Password=${MYSQL_PASSWORD}"
      TokenSettings__Secret: ${TOKEN_SECRET:?Define TOKEN_SECRET en el archivo .env (minimo 32 caracteres)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173}
      EnableSwagger: "true"
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      # La imagen de ASP.NET no trae curl; usamos bash con /dev/tcp
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health HTTP/1.0\r\n\r\n" >&3; head -n1 <&3 | grep -q 200']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
